<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Menagerie — anonymous compatibility profiles</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Hatch an anonymous compatibility profile, share it as a phrase or QR code, and lay profiles side by side to see where you overlap. No accounts, no names, no tracking — the server stores only ciphertext it can't read."
    />
    <meta name="referrer" content="no-referrer" />

    <!-- Link previews. Deliberately generic: a #/view/<phrase> link and a bare
         link must unfurl identically, because the preview is rendered into a
         chat window that shoulders can read and the phrase is not for them.
         Hash routing makes this the only possible answer anyway — the fragment
         never reaches a server, so no preview can ever be about a profile. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Menagerie" />
    <meta property="og:title" content="Menagerie — anonymous compatibility profiles" />
    <meta
      property="og:description"
      content="Hatch a profile, share a phrase or QR code, and lay two profiles side by side to see where you overlap. No accounts, no names — and intimate answers reveal only when they're mutual."
    />
    <meta property="og:image" content="social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The word Menagerie above the line 'Compatibility, minus the identity', with a row of pixel-art creatures."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#4a3aa7" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234a3aa7'/><g fill='white'><circle cx='31' cy='36' r='10'/><circle cx='50' cy='30' r='10'/><circle cx='69' cy='36' r='10'/><ellipse cx='50' cy='63' rx='20' ry='16'/></g></svg>"
    />
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      <div
        style="
          max-width: 640px;
          margin: 60px auto;
          padding: 0 20px;
          font-family: system-ui, sans-serif;
        "
      >
        <h1>Menagerie needs JavaScript</h1>
        <p>
          Your answers are encrypted and decrypted locally in your browser — the server only ever
          stores ciphertext it can't read. That local crypto means JavaScript has to be enabled.
        </p>
      </div>
    </noscript>
  </body>
</html>
