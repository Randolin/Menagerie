<header class="app-header">
  <a class="brand" routerLink="/home">
    <span class="brand-mark" aria-hidden="true">M</span>Moxy
  </a>
  <nav class="nav" aria-label="Main">
    <a routerLink="/survey" routerLinkActive="active">My profile</a>
    <a routerLink="/compare" routerLinkActive="active">Compare</a>
    <a routerLink="/vault" routerLinkActive="active">Vault</a>
    <a routerLink="/about" routerLinkActive="active">How it works</a>
  </nav>
  <button class="btn btn-ghost btn-small" title="Theme" aria-label="Toggle theme"
          (click)="cycleTheme()">◐</button>
</header>

<main id="view">
  <router-outlet />
</main>

<footer class="app-footer">
  <p>
    Moxy runs entirely in your browser. No accounts, no servers, no analytics —
    <a routerLink="/about">see exactly how</a>.
  </p>
</footer>

<moxy-toast />
