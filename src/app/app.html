<header class="app-header">
  <a class="brand" routerLink="/">
    <span class="brand-mark" aria-hidden="true">M</span>Moxy
  </a>
  <nav class="nav" aria-label="Main">
    <a routerLink="/me" routerLinkActive="active">My profile</a>
    <a routerLink="/compare" routerLinkActive="active">Compare</a>
    <a routerLink="/about" routerLinkActive="active">How it works</a>
  </nav>
  <button class="btn btn-ghost btn-small" title="Theme" aria-label="Toggle theme"
          (click)="cycleTheme()">◐</button>
</header>

<main id="view">
  <router-outlet />
</main>

<footer class="app-footer">
  <p>
    No accounts, no names, no analytics — the server stores only ciphertext it can’t
    read. <a routerLink="/about">See exactly how</a>.
  </p>
</footer>

<moxy-toast />
