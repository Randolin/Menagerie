# CI + GitHub Pages deploy.
#
# Every push and PR runs the full verification ladder (core, server, and app
# unit tests, production build, and the Playwright e2e suite — the whole
# hatch lifecycle against a real spawned profile server, including GC and the
# zero-knowledge-at-rest scan). Pushes to the default branch then publish
# dist/ to GitHub Pages, with the production profile-server URL stamped into
# moxy.config.json from the MOXY_SERVER_URL repository variable
# (Settings → Secrets and variables → Actions → Variables).
#
# One-time manual step (Actions cannot do this): repo Settings → Pages →
# Source = "GitHub Actions".
#
# Hash routing means Pages needs no 404-fallback tricks, and the build's
# --base-href ./ works at both a root domain and a /Moxy/ project path.
name: CI & Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Core library tests (plain Node, framework-free)
        run: npm run test:core

      - name: Profile server integration tests
        run: npm run test:server

      - name: App component tests
        run: npx ng test

      - name: Production build
        run: npx ng build --base-href ./

      - name: Install Chromium for e2e (version-matched to playwright-core)
        run: |
          PW_VERSION=$(node -p "require('playwright-core/package.json').version")
          npx --yes "playwright@${PW_VERSION}" install --with-deps chromium

      - name: End-to-end suite (drives the production build + real profile server)
        run: |
          export CHROMIUM_BIN=$(node -p "require('playwright-core').chromium.executablePath()")
          npm run e2e

      - name: Stamp the production profile-server URL into the Pages artifact
        env:
          MOXY_SERVER_URL: ${{ vars.MOXY_SERVER_URL }}
        run: |
          node -e 'const fs = require("fs");
            fs.writeFileSync("dist/moxy/browser/moxy.config.json",
              JSON.stringify({ serverUrl: process.env.MOXY_SERVER_URL ?? "" }) + "\n");'
          cat dist/moxy/browser/moxy.config.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/moxy/browser

  deploy:
    # main is the release branch: feature branches get the full test job on
    # every push and PR, but only pushes to main publish to Pages.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
