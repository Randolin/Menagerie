# CI + GitHub Pages deploy.
#
# Every PR and every push to main runs the full verification ladder (format
# check, server and script typechecks, the four unit suites, production build, and the
# Playwright e2e suite — the whole hatch lifecycle against a real spawned
# profile server, including GC and the zero-knowledge-at-rest scan). Branch
# pushes without a PR get no CI — open the PR to get the ladder. Pushes to
# main then publish dist/ to GitHub Pages, with the production
# profile-server URL stamped into menagerie.config.json from the MENAGERIE_SERVER_URL
# repository variable
# (Settings → Secrets and variables → Actions → Variables).
#
# One-time manual step (Actions cannot do this): repo Settings → Pages →
# Source = "GitHub Actions".
#
# Hash routing means Pages needs no 404-fallback tricks, and the build's
# --base-href ./ works at a root domain and any project path alike.
name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check (prettier)
        run: npm run format:check

      - name: Server typecheck (vitest strips types without checking them)
        run: npm run typecheck:server

      - name: Seed-script typecheck (no test suite covers scripts/)
        run: npm run typecheck:scripts

      - name: Core library tests (plain Node, framework-free)
        run: npm run test:core

      - name: Profile server integration tests
        run: npm run test:server

      - name: UI library pure-module tests (plain Node)
        run: npm run test:ui

      - name: App component tests
        run: npm run test:app

      - name: Production build
        run: npx ng build --base-href ./

      - name: Install Chromium for e2e (version-matched to playwright-core)
        run: |
          PW_VERSION=$(node -p "require('playwright-core/package.json').version")
          npx --yes "playwright@${PW_VERSION}" install --with-deps chromium

      - name: End-to-end suite (drives the production build + real profile server)
        run: |
          export CHROMIUM_BIN=$(node -p "require('playwright-core').chromium.executablePath()")
          npm run e2e

      - name: Stamp the production profile-server URL into the Pages artifact
        env:
          MENAGERIE_SERVER_URL: ${{ vars.MENAGERIE_SERVER_URL }}
        run: |
          node -e 'const fs = require("fs");
            fs.writeFileSync("dist/menagerie/browser/menagerie.config.json",
              JSON.stringify({ serverUrl: process.env.MENAGERIE_SERVER_URL ?? "" }) + "\n");'
          cat dist/menagerie/browser/menagerie.config.json

      # og:image must be absolute — most link unfurlers will not resolve a
      # relative one — but the source can't hardcode a host, because anyone
      # may self-host this bundle anywhere. So the deploy that knows its own
      # address is what fills it in, from the same kind of repo variable that
      # already carries the server URL; a copy served from somewhere else
      # keeps the relative path rather than pointing at ours. Unset is a
      # degraded preview, never a failed build.
      - name: Stamp the deployed origin into the link-preview image URL
        env:
          MENAGERIE_SITE_URL: ${{ vars.MENAGERIE_SITE_URL }}
        run: |
          node -e 'const fs = require("fs");
            const base = (process.env.MENAGERIE_SITE_URL ?? "").replace(/\/+$/, "");
            if (!base) { console.log("no site URL known — og:image stays relative"); process.exit(0); }
            const f = "dist/menagerie/browser/index.html";
            fs.writeFileSync(f, fs.readFileSync(f, "utf8")
              .replace(/(property="og:image" content=")social-card\.png/, `$1${base}/social-card.png`));
            console.log(`og:image → ${base}/social-card.png`);'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/menagerie/browser

  deploy:
    # main is the release branch: feature branches get the full test job on
    # every push and PR, but only main publishes to Pages — via its pushes,
    # or a manual workflow_dispatch (e.g. to re-stamp menagerie.config.json after
    # the MENAGERIE_SERVER_URL variable changes without any code change).
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
