# CI + GitHub Pages deploy.
#
# Every push and PR runs the full verification ladder (core, server, and app
# unit tests, production build, and the Playwright e2e suite — including the
# two-device sync tests against a real spawned sync server). Pushes to the
# default branch then publish dist/ to GitHub Pages.
#
# One-time manual step (Actions cannot do this): repo Settings → Pages →
# Source = "GitHub Actions".
#
# Hash routing means Pages needs no 404-fallback tricks, and the build's
# --base-href ./ works at both a root domain and a /Moxy/ project path.
name: CI & Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Core library tests (plain Node, framework-free)
        run: npm run test:core

      - name: Sync server integration tests
        run: npm run test:server

      - name: App component tests
        run: npx ng test

      - name: Production build
        run: npx ng build --base-href ./

      - name: Install Chromium for e2e (version-matched to playwright-core)
        run: |
          PW_VERSION=$(node -p "require('playwright-core/package.json').version")
          npx --yes "playwright@${PW_VERSION}" install --with-deps chromium

      - name: End-to-end suite (drives the production build + real sync server)
        run: |
          export CHROMIUM_BIN=$(node -p "require('playwright-core').chromium.executablePath()")
          npm run e2e

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/moxy/browser

  deploy:
    # Deploys only from the default branch; the explicit list keeps this
    # working today and after any future rename/merge to main.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
